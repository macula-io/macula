[package]
name = "macula_quic"
version = "0.1.0"
edition = "2021"
authors = ["Macula <raf.lefever@erlef.org>"]
description = "Quinn QUIC NIF for the Macula mesh — per-address IPv6 binding"

[lib]
name = "macula_quic"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"
quinn = "0.11"
# The TLS posture comes from macula-pqc, and nowhere else: every TLS
# configuration here starts from its client_builder()/server_builder(),
# which offer SecP384r1MLKEM1024 then SecP256r1MLKEM768, sign and verify
# ML-DSA-87, and nothing classical. It also makes the station's
# certificate and the one verifier a dial uses. So rustls selects no
# crypto provider of its own in this manifest. The published crate, not a
# git or path dependency.
macula-pqc = "0.2"
# TLS 1.3 only: macula-pqc's builders fix it, so rustls is built without
# TLS 1.2 at all.
rustls = { version = "0.23", default-features = false, features = ["logging", "std"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
bytes = "1"

[dev-dependencies]
# The tests build the peers this NIF must refuse or still agree with: a
# classical-only one, and one on the list deployed before macula-pqc. Those
# come from aws-lc-rs's own groups.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# An ECDSA certificate, for the station this NIF must refuse. The aws-lc-rs
# backend, already linked; rcgen spells the feature with underscores.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }

[profile.release]
lto = true
opt-level = 3
