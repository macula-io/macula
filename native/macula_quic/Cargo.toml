[package]
name = "macula_quic"
version = "0.1.0"
edition = "2021"
authors = ["Macula <raf.lefever@erlef.org>"]
description = "Quinn QUIC NIF for the Macula mesh — per-address IPv6 binding"

[lib]
name = "macula_quic"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"
quinn = "0.11"
# The key exchange comes from macula-pqc, and nowhere else: every TLS
# configuration here starts from its client_builder()/server_builder(),
# which offer SecP384r1MLKEM1024 then SecP256r1MLKEM768 and nothing
# classical. So rustls selects no crypto provider of its own in this
# manifest. The published crate, not a git or path dependency.
#
# It is NOT post-quantum SIGNATURES: the provider's signature algorithms are
# ECDSA, Ed25519 and RSA, and rustls-webpki has no ML-DSA. This is
# post-quantum key exchange and nothing else.
macula-pqc = "0.1"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1.0"
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
bytes = "1"
# Self-signed Ed25519 cert generation for pubkey-anchored QUIC.
# Same provider as rustls above, so one crypto backend is linked rather
# than two. rcgen spells the feature with underscores.
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
# rcgen exposes its `not_before`/`not_after` as `time::OffsetDateTime`.
time = "0.3"
# Extract Ed25519 SPKI pubkey from leaf cert for pubkey-pin
# verification.
x509-parser = "0.18"

[dev-dependencies]
# The tests build the peers this NIF must refuse or still agree with: a
# classical-only one, and one on the list deployed before macula-pqc. Those
# come from aws-lc-rs's own groups.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[profile.release]
lto = true
opt-level = 3
