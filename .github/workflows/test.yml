name: Test

# Runs the suite on every push and pull request: eunit and common_test under
# cover with the merged line coverage held to a floor, xref and dialyzer, the
# linter, the docs build, the frozen wire vectors, and the wire property tests.
#
# It also gates the publish: publish-hex.yml calls it on the release tag and
# publishes only when it is green (mcl-om#34).
#
# A red run here is information, not an inconvenience. Nothing in this file
# may be weakened to produce a green: no continue-on-error, no suite dropped,
# no failure matched away. If the suite finds something, the suite found
# something.

on:
  # publish-hex.yml runs this on the tagged commit and publishes only when it
  # is green (mcl-om#34).
  workflow_call:
  push:
    # Branches only. Without this, `push` matches TAG refs too, and every
    # release tag ran a second full job on a tree that had just gone green
    # on main minutes earlier.
    #
    # The tagged commit still gets the suite, once: publish-hex.yml calls
    # this workflow (workflow_call above) on the tag and publishes only when
    # it is green (mcl-om#34).
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

env:
  # Must equal the erlang pin in .tool-versions AND the OTP the container
  # ships. scripts/is_erlang_the_pinned_version.sh asserts the second against
  # the first below rather than assuming it; this copy exists to key the PLT
  # cache.
  OTP_VERSION: '28.4.3'
  # The tools the build image (container: below) must carry, asserted by
  # scripts/is_ci_image_the_pinned_one.sh before anything builds. They name
  # what the pinned image digest already contains; move them together with it.
  # Rust comes from the image (CARGO_HOME=/usr/local/cargo, RUSTUP_HOME=
  # /usr/local/rustup, baked in); this job installs none of its own.
  CI_REBAR3_VERSION: '3.27.0'
  CI_RUST_VERSION: '1.98.1'

concurrency:
  # On a BRANCH a newer push should cancel the older run: nobody is waiting on
  # the answer for a commit that has been superseded.
  #
  # On MAIN it must not, and this used to. During a busy stretch every run on
  # main was cancelled by the next push, so no run on main completed and there
  # was NO COMMIT ON MAIN WE COULD CALL GREEN, which is the one thing
  # trunk-based development rests on. Observed: two consecutive runs on main
  # cancelled at 4.9 and 7.6 minutes.
  #
  # Keying the group on the sha for main gives every commit there its own
  # group, so nothing cancels it and every commit on main gets an answer.
  # Branch behaviour is unchanged.
  group: test-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'ref' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.check }}

    # The four checks used to run one after another in a single job, so the
    # wall clock was their sum and eunit (by far the longest) delayed the
    # three short ones. They share every setup step above, so a matrix runs
    # them in parallel without duplicating the container, the toolchain or
    # the caches.
    #
    # eunit and ct are ONE entry, not two (#153). They are run together under
    # cover so the coverage floor has the whole suite to measure, and they cost
    # almost nothing to join: eunit takes about twelve minutes instrumented and
    # ct about twelve seconds (measured 2026-10-28, in CI and in this image). As
    # two entries, ct paid a second container, toolchain and NIF build — minutes
    # of setup for twelve seconds of test — to report what the joined entry
    # reports from one run.
    #
    # fail-fast is OFF deliberately: the serial job reported every check's
    # result, and cancelling the others on the first red would report less
    # than it used to.
    strategy:
      fail-fast: false
      matrix:
        check: [coverage, xref, dialyzer, lint, docs, vectors, proper]
    # A GitHub-hosted public runner, deliberately. macula is a public
    # repository and this costs nothing there. Do NOT put `self-hosted` here:
    # the Default runner group is closed to public repositories on purpose,
    # and a self-hosted runner reachable from a public repo would let a fork's
    # pull request run arbitrary code on a machine holding real credentials.
    # That property is load-bearing.
    runs-on: ubuntu-latest

    # WHY A CONTAINER, since a job in one on a public runner looks like
    # something to simplify away: a STOCK GitHub runner's libcrypto has NO
    # ML-DSA. The first run of this workflow died 180 times on
    # `crypto:generate_key(mldsa87, [])` with
    # `{badarg,{"evp.c",259},"Bad key type"}`, taking out every test that
    # needs a node identity, which for a post-quantum SDK is most of them.
    # ML-DSA arrived in OpenSSL 3.5. This image carries OpenSSL 3.5.7 and
    # OTP 28.4.3, and generating an ML-DSA-87 key in it was measured rather
    # than read off a supports list. The runner underneath is still an
    # ordinary public one, so nothing about the security property above
    # changes; the cost is an image pull.
    #
    # The image also supplies rebar3 and Rust, pinned exactly, so this job
    # runs neither erlef/setup-beam nor rustup. Installing another OTP over
    # the image's would link crypto against a different libcrypto and could
    # quietly put back the exact failure the container is here to fix.
    #
    # ⚠ PINNED BY DATED TAG AND DIGEST, never :latest. With :latest, any
    # rebuild of the image changed the toolchain this repo builds with, with
    # no commit here. A new toolchain now arrives only as a commit to this
    # line, together with CI_REBAR3_VERSION / CI_RUST_VERSION above.
    container: ghcr.io/macula-io/macula-ci-otp:20260923-1352@sha256:aff1d39bc4aa29d13044b90b38e9b7f4b757d50818cc11c5bb7e84cdbf82ac70

    timeout-minutes: 60

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4

      # Every NIF crate builds from source (priv/build-nifs.sh, run by
      # rebar.config's compile pre_hook), and macula_cbor_nif has no prebuilt
      # artifact at all, so a toolchain-less run does not fall back, it fails.
      # Worse, a build that silently lacks NIFs runs the pure-Erlang crypto
      # path, which reads as unrelated test failures rather than as a missing
      # toolchain.
      #
      # The Rust they build with is the image's, pinned. This step installed
      # rustup's `stable' at job time, back when the image carried no Rust,
      # so the compiler floated even with the image pinned. The image has
      # shipped Rust since macula-ci-images 0c9ec10, and macula-station's CI
      # builds every NIF crate from source with it, through the same
      # pre_hook, with nothing installed at job time.
      - name: Check the CI image and its toolchain are the pinned ones
        run: bash scripts/is_ci_image_the_pinned_one.sh .github/workflows/test.yml

      # The download cache only. Deliberately NOT native/*/target and
      # NOT priv/*.so: build-nifs.sh skips a crate whose .so is newer than
      # its sources, so a restored binary can outrank the tree it is supposed
      # to have been built from. That trap has already shipped a NIF that
      # did not match its source once.
      - name: Cache the cargo download registry
        uses: actions/cache@v4
        with:
          # /usr/local/cargo, the image's baked-in CARGO_HOME: a cache path is
          # a claim about where the tool writes.
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('native/*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # rebar.config sets plt_location local and base_plt_location global, so
      # the PLT lands in both places. Without this every run pays the full
      # PLT build, not just the first.
      #
      # The global one goes under $HOME, and a container job sets
      # HOME=/github/home rather than root's /root. Caching /root/.cache
      # matched nothing. The local PLT under _build covers the common case
      # on its own, so this only bites on a cache miss, when rebar.config or
      # rebar.lock changes the key.
      - name: Cache the dialyzer PLT
        uses: actions/cache@v4
        with:
          path: |
            _build/consumer_contracts/*_plt
            _build/consumer_contracts/*_plt.hash
            /github/home/.cache/rebar3
          key: plt-${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: plt-${{ runner.os }}-otp${{ env.OTP_VERSION }}-

      # Asserts the OTP the container actually ships against .tool-versions,
      # so the image and the pin cannot drift apart unnoticed.
      - name: Check the Erlang on PATH is the pinned one
        run: bash scripts/is_erlang_the_pinned_version.sh

      # WHAT THIS IS FOR, because it looks redundant next to the suite that
      # follows: it asserts the reason this job runs in a container at all,
      # before the suite rather than 180 failures into it.
      #
      # This check exists because we learned the hard way. The first run of
      # this workflow produced 180 failures across 53 test modules, all of
      # them reading as unrelated test breakage, and the real cause was one
      # missing algorithm in the runner's libcrypto. Diagnosing that took an
      # evening. A libcrypto without ML-DSA now fails HERE instead, in one
      # line that names the cause, before a single test runs.
      #
      # If you are tidying this workflow: deleting this step does not make
      # the suite any greener, it only makes the next libcrypto change cost
      # what this one cost.
      - name: Check this Erlang can do ML-DSA-87
        run: |
          erl -noshell -eval '
            {Pub, _Priv} = crypto:generate_key(mldsa87, []),
            io:format("ML-DSA-87 ok, public key ~p bytes, on ~p~n",
                      [byte_size(Pub), crypto:info_lib()]),
            halt().'

      - name: Compile, which builds the NIFs
        run: rebar3 compile 2>&1 | tee build.log

      # Asserts the shape of success rather than the absence of an error: the
      # QUIC NIF must actually load from what this build produced. A build
      # whose NIFs are missing otherwise reaches eunit and fails there, in
      # tests that have nothing to do with the cause.
      - name: Check the QUIC NIF loads from this build
        run: bash scripts/is_quic_nif_built_from_this_tree.sh _build/default/lib build.log

      # Known to be flaky under load. If this goes red intermittently, that is
      # reported as "flaky, N of M runs", not silenced here.
      #
      # --cover is what turns this run into the coverage number (#153). It costs
      # about a quarter more run time (rebar.config's note on cover_enabled), and
      # it buys a figure measured on the run that gated, rather than on a second
      # run of the same tests in a job of its own.
      - name: eunit
        id: eunit
        if: matrix.check == 'coverage'
        run: rebar3 eunit --cover --cover_export_name eunit

      # The fleet suites in test/overlay: realm-gated HyParView admission and
      # Plumtree gossip, across in-VM stations, over the frame codec. Until
      # this step nothing ran common_test, and both suites failed from 11.x on
      # without anyone seeing it. Every suite under test/ runs here; one that
      # needs something CI does not have belongs outside test/, not skipped.
      #
      # --cover for the same reason as eunit above. What it adds is small and
      # measured, not assumed: eunit accounts for all but a couple of the covered
      # lines today. It is measured anyway because the floor is a property of the
      # SUITE, and today's overlap between the two halves is an accident of which
      # modules the fleet suites happen to touch. If that stops being true, the
      # number must not keep looking complete without it.
      #
      # ct runs exactly when eunit RAN — not on the default `success()`, and not
      # on `!cancelled()` alone. eunit and ct used to be separate matrix entries,
      # so a red eunit did not stop ct from reporting, and joining them must not
      # quietly cost that. But the job also has a compile step, a NIF-load check
      # and the OTP-pin assertion before eunit, and `!cancelled()` would run ct
      # after one of those failed too: ct would then be executed against a build
      # that is already known bad and would add failures with nothing to do with
      # it. A step whose outcome is `success` or `failure` is a step that ran, so
      # this is "after eunit, whatever eunit said".
      - name: common_test
        id: common_test
        if: ${{ !cancelled() && matrix.check == 'coverage' && (steps.eunit.outcome == 'success' || steps.eunit.outcome == 'failure') }}
        run: rebar3 ct --cover --cover_export_name ct

      # A failed common_test run leaves its reasons in HTML logs, not on the
      # console, so they are kept for a week.
      - name: Keep the common_test logs of a failed run
        if: failure() && matrix.check == 'coverage' && steps.common_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: common-test-logs
          path: _build/test/logs
          retention-days: 7

      # The floor (#153). Merging is the point: this step has just run both
      # suites and each `--cover` exported only its own half, so the merge is
      # what puts the suite back together into one number. It runs last, and
      # only when both suites are green: a suite that failed tells you more
      # about the run than its coverage would, and a figure from a suite that
      # stopped early describes tests that never ran.
      - name: Line coverage, merged over both suites, at or above the floor
        if: matrix.check == 'coverage'
        run: |
          bash scripts/is_line_coverage_at_least_the_floor.sh \
            _build/test/cover/eunit.coverdata \
            _build/test/cover/ct.coverdata

      - name: xref
        if: matrix.check == 'xref'
        run: rebar3 xref

      # Elvis (rebar.config's macula_min ruleset) as a hard gate. Until this
      # step nothing ran it, and fifteen nesting violations reached main
      # without comment (#84).
      - name: lint
        if: matrix.check == 'lint'
        run: rebar3 as lint lint

      # The package and its docs, as publish-hex.yml builds them on a release
      # tag. Until this step nothing before the tag built the docs, so an edoc
      # refusal (two @doc tags on one function) passed every check here and
      # stopped the 14.4.0 publish dry-run instead.
      - name: docs
        if: matrix.check == 'docs'
        run: rebar3 hex build

      - name: dialyzer
        if: matrix.check == 'dialyzer'
        # The consumer_contracts profile adds the calls a consumer makes, so a
        # spec that refuses them fails here (rebar.config).
        run: rebar3 as consumer_contracts dialyzer

      # The wire 1.0 vectors are FROZEN: outside a release decision no case
      # expectation may move. Nothing ran the generator, which is how four
      # separate drifts stacked up behind macula#107's first crash, and how
      # five frame cases reached main carrying objects the current reader
      # refuses (macula#108).
      #
      # This regenerates the vectors twice into temporary directories and
      # compares both against the committed files. It DERIVES the per-run set
      # rather than trusting a list of it: whatever differs between two runs of
      # the same code is per-run material by definition, so anything else that
      # differs from the committed vectors is drift. There is no allow-list in
      # it to rot, and it compares below the hex leaf, because at leaf level
      # every frame case looks per-run and none of the drift would be visible.
      #
      # It also puts each frame case's embedded record to the reader at the
      # vectors' clock, so an object whose clock is read at generation time
      # fails here rather than quietly rotting in a shipped package.
      - name: wire 1.0 vectors
        if: matrix.check == 'vectors'
        run: bash scripts/check-wire-1-0-vectors.sh

      # The wire property tests (macula#151): CBOR canonicalisation and round-trip, the frame codec, signed records
      # and UCAN tokens, over inputs generated rather than listed. `proper' has been a test dependency with nothing
      # using it; this is the step that runs it, and it fails when ZERO properties ran — a renamed module or a file
      # proper does not discover would otherwise turn the check green while testing nothing.
      - name: property tests
        if: matrix.check == 'proper'
        run: bash scripts/is_the_property_suite_running.sh

  # The structural floor for the native crates (macula-codebase-checks#9):
  # a function that nests past three blocks, goes past cognitive complexity
  # 15 or runs past 60 lines fails here, against each crate's own
  # clippy.toml and [lints.clippy].
  #
  # Its own job, not a matrix entry above: that job runs in the pinned OTP
  # image, whose Rust carries no clippy component, and a plain runner with
  # dtolnay/rust-toolchain is what a clippy run needs. The toolchain is
  # pinned to the same version the image ships, so the two cannot disagree
  # about Rust.
  rust-lint:
    name: rust (clippy, deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/macula_cbor_nif
            native/macula_crypto_nif
            native/macula_mri_nif
            native/macula_quic
            scripts/e2e_seal_vectors
      # One line per crate, named rather than globbed: the sweep reads these
      # lines, and a crate that is skipped by a glob cannot be seen to be
      # skipped.
      - name: clippy, every native crate
        run: |
          cargo clippy --manifest-path native/macula_cbor_nif/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path native/macula_crypto_nif/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path native/macula_mri_nif/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path native/macula_quic/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path scripts/e2e_seal_vectors/Cargo.toml --all-targets --locked -- -D warnings

  # A dependency this package ships with a published advisory fails the build
  # (macula-codebase-checks#11). Erlang reads the resolved rebar.lock: a rebar3
  # project commits none, so the build's own lock is what the scanner receives.
  advisories-erlang:
    name: Dependency advisories (erlang)
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@83a76a358456bf2f7d6c919ad5e8fe7fd2162ce3
    with:
      ecosystem: erlang
      otp-version: '28.4.3'
      rebar3-version: '3.27.0'

  # The same for the four Rust NIF crates, which build from source and ship in
  # the package: each has its own Cargo.lock, so each is its own job.
  advisories-rust:
    name: Dependency advisories (rust)
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@83a76a358456bf2f7d6c919ad5e8fe7fd2162ce3
    with:
      ecosystem: rust
      working-directories: '["native/macula_cbor_nif","native/macula_crypto_nif","native/macula_mri_nif","native/macula_quic"]'
