[package]
name = "e2e_seal_vectors"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generates test/vectors/e2e_seal_v1.json, the E2E seal scheme 1 vectors (test/vectors/E2E_SEAL_V1.md)"

[dependencies]
# Deterministic ML-KEM from fixed seeds: the `internal` feature, for test
# vectors only (FIPS 203 sections 3.3 and 6).
macula-mlkem = { version = "0.3", features = ["internal"] }
p384 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
ciborium = "0.2"
serde_json = "1"
hex = "0.4"
