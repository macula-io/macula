<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360">
  <defs>
    <marker id="p-out" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7280"/></marker>
    <marker id="p-dht" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/></marker>
    <marker id="p-push" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#3b82f6"/></marker>
    <marker id="p-reply" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#10b981"/></marker>
    <linearGradient id="hg5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh5" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="820" height="360" rx="6" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="40" fill="url(#hg5)"/>
  <text x="410" y="26" text-anchor="middle" fill="white" font-family="system-ui" font-size="15" font-weight="bold">Push-Initiated Content Transfer — macula_pusher / macula_upload</text>

  <!-- Legend -->
  <rect x="620" y="50" width="190" height="86" rx="5" fill="white" stroke="#e5e7eb" filter="url(#sh5)"/>
  <line x1="630" y1="66" x2="656" y2="66" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#p-dht)"/>
  <text x="664" y="69" font-family="system-ui" font-size="9" fill="#6b7280">Resolve procedure (direct-dial)</text>
  <line x1="630" y1="84" x2="656" y2="84" stroke="#3b82f6" stroke-width="2" marker-end="url(#p-push)"/>
  <text x="664" y="87" font-family="system-ui" font-size="9" fill="#6b7280">Push chunks (client_stream)</text>
  <line x1="630" y1="102" x2="656" y2="102" stroke="#10b981" stroke-width="2" marker-end="url(#p-reply)"/>
  <text x="664" y="105" font-family="system-ui" font-size="9" fill="#6b7280">Verified reply</text>
  <text x="630" y="123" font-family="system-ui" font-size="8.5" fill="#9ca3af">Mcid known before any byte is sent</text>

  <!-- Pusher P on Station A -->
  <rect x="40" y="150" width="150" height="44" rx="8" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#sh5)"/>
  <text x="115" y="169" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#1d4ed8">Pusher P</text>
  <text x="115" y="185" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#6b7280">macula_pusher</text>
  <rect x="40" y="232" width="150" height="52" rx="10" fill="#fef9c3" stroke="#f59e0b" stroke-width="2" filter="url(#sh5)"/>
  <text x="115" y="253" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#b45309">Station A</text>
  <text x="115" y="270" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#a16207">DHT / routing</text>
  <line x1="115" y1="232" x2="115" y2="196" stroke="#6b7280" stroke-width="1.5" marker-end="url(#p-out)"/>

  <!-- Upload U on Station B -->
  <rect x="630" y="150" width="150" height="44" rx="8" fill="white" stroke="#f97316" stroke-width="2" filter="url(#sh5)"/>
  <text x="705" y="169" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#c2410c">Upload U</text>
  <text x="705" y="185" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#6b7280">macula_upload</text>
  <rect x="630" y="232" width="150" height="52" rx="10" fill="#fef9c3" stroke="#f59e0b" stroke-width="2" filter="url(#sh5)"/>
  <text x="705" y="253" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#b45309">Station B</text>
  <text x="705" y="270" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#a16207">advertised procedure</text>
  <line x1="705" y1="232" x2="705" y2="196" stroke="#6b7280" stroke-width="1.5" marker-end="url(#p-out)"/>

  <!-- DHT resolve band (direct-dial) -->
  <line x1="192" y1="258" x2="628" y2="258" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#p-dht)"/>
  <rect x="316" y="248" width="188" height="20" rx="4" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="410" y="262" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="500" fill="#6d28d9">DHT: resolve procedure_advertisement</text>

  <!-- Push chunks P -> U -->
  <path d="M 190 165 C 380 120, 470 120, 630 165" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#p-push)"/>
  <text x="410" y="120" text-anchor="middle" font-family="system-ui" font-size="9.5" font-weight="600" fill="#1d4ed8">open client_stream, manifest as Args, chunk[0..n] → half-close</text>
  <!-- Verified reply U -> P -->
  <path d="M 630 178 C 470 150, 380 150, 190 178" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#p-reply)"/>
  <text x="410" y="146" text-anchor="middle" font-family="system-ui" font-size="9" fill="#059669">U verifies, then replies — client_stream's own terminal-reply channel</text>

  <!-- Steps -->
  <text x="410" y="303" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#374151">1. P chunks and hashes the bytes locally (macula_manifest:create/2) — the Mcid is deterministic, known before anything is sent</text>
  <text x="410" y="318" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#374151">2. P opens a client_stream to U's advertised procedure, the manifest riding the stream's open-time Args (out-of-band, not a header chunk)</text>
  <text x="410" y="333" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#374151">3. U accumulates chunks, reassembles, and verifies against the manifest — receiver-side, never sender-trusted — then sets the terminal reply</text>
  <text x="410" y="351" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#9ca3af">Unlike content sharing's pull-then-verify: this pushes AT a specific, already-known recipient — no content_announcement, no anyone-can-pull.</text>
</svg>
