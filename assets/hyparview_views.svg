<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <defs>
    <marker id="hv-active" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
    <marker id="hv-promote" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="hv-evict" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f97316"/></marker>
    <marker id="hv-shuffle" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/></marker>
    <linearGradient id="hv-hg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="hv-sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="900" height="440" rx="6" fill="#f8fafc"/>
  <rect x="0" y="0" width="900" height="40" fill="url(#hv-hg)"/>
  <text x="450" y="26" text-anchor="middle" fill="white" font-family="system-ui" font-size="15" font-weight="bold">HyParView: Active vs. Passive View (one realm member's perspective)</text>

  <!-- Legend -->
  <rect x="702" y="50" width="182" height="112" rx="5" fill="white" stroke="#e5e7eb" filter="url(#hv-sh)"/>
  <line x1="712" y1="66" x2="738" y2="66" stroke="#10b981" stroke-width="2" marker-end="url(#hv-active)"/>
  <text x="746" y="69" font-family="system-ui" font-size="9" fill="#6b7280">Active connection</text>
  <circle cx="725" cy="84" r="5" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="746" y="87" font-family="system-ui" font-size="9" fill="#6b7280">Passive candidate</text>
  <line x1="712" y1="102" x2="738" y2="102" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#hv-promote)"/>
  <text x="746" y="105" font-family="system-ui" font-size="9" fill="#6b7280">Promote (active peer failed)</text>
  <line x1="712" y1="120" x2="738" y2="120" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#hv-evict)"/>
  <text x="746" y="123" font-family="system-ui" font-size="9" fill="#6b7280">Evict (active view over cap)</text>
  <line x1="712" y1="138" x2="738" y2="138" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#hv-shuffle)"/>
  <text x="746" y="141" font-family="system-ui" font-size="9" fill="#6b7280">SHUFFLE (~30s)</text>
  <text x="712" y="157" font-family="system-ui" font-size="8" fill="#9ca3af">caps: active 5, passive 4x active</text>

  <!-- Self -->
  <rect x="30" y="180" width="140" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#hv-sh)"/>
  <text x="100" y="205" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#1d4ed8">Self</text>
  <text x="100" y="221" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#3b82f6">macula_hyparview_view</text>
  <text x="100" y="234" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6b7280">:new(SelfId)</text>

  <!-- Active view box -->
  <rect x="230" y="60" width="220" height="320" rx="10" fill="none" stroke="#10b981" stroke-width="1.3" stroke-dasharray="6 3"/>
  <text x="340" y="52" text-anchor="middle" font-family="system-ui" font-size="10.5" font-weight="600" fill="#059669">Active view (cap 5) — live connections</text>

  <!-- Active peers -->
  <g font-family="system-ui">
    <rect x="255" y="80" width="170" height="42" rx="8" fill="white" stroke="#10b981" stroke-width="2" filter="url(#hv-sh)"/>
    <text x="340" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Active peer A</text>

    <rect x="255" y="140" width="170" height="42" rx="8" fill="white" stroke="#10b981" stroke-width="2" filter="url(#hv-sh)"/>
    <text x="340" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Active peer B</text>

    <rect x="255" y="200" width="170" height="42" rx="8" fill="white" stroke="#10b981" stroke-width="2" filter="url(#hv-sh)"/>
    <text x="340" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Active peer C</text>

    <rect x="255" y="300" width="170" height="42" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="4 2" filter="url(#hv-sh)"/>
    <text x="340" y="323" text-anchor="middle" font-size="10.5" font-weight="600" fill="#c2410c">Active peer D — about</text>
    <text x="340" y="335" text-anchor="middle" font-size="9" fill="#c2410c">to overflow the cap</text>
  </g>

  <!-- Self -> active peers -->
  <line x1="170" y1="205" x2="253" y2="101" stroke="#10b981" stroke-width="2" marker-end="url(#hv-active)"/>
  <line x1="170" y1="210" x2="253" y2="161" stroke="#10b981" stroke-width="2" marker-end="url(#hv-active)"/>
  <line x1="170" y1="215" x2="253" y2="221" stroke="#10b981" stroke-width="2" marker-end="url(#hv-active)"/>
  <line x1="170" y1="222" x2="253" y2="315" stroke="#10b981" stroke-width="2" marker-end="url(#hv-active)"/>

  <!-- Passive view box -->
  <rect x="490" y="60" width="380" height="320" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="6 3"/>
  <text x="680" y="52" text-anchor="middle" font-family="system-ui" font-size="10.5" font-weight="600" fill="#6b7280">Passive view (&#8804;20 candidates) — no connection held</text>

  <g fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.3">
    <circle cx="555" cy="220" r="14"/>
    <circle cx="645" cy="190" r="14"/>
    <circle cx="735" cy="220" r="14"/>
    <circle cx="825" cy="190" r="14"/>
    <circle cx="555" cy="320" r="14"/>
    <circle cx="645" cy="290" r="14"/>
    <circle cx="735" cy="320" r="14"/>
    <circle cx="825" cy="290" r="14"/>
  </g>
  <g font-family="system-ui" font-size="8" fill="#6b7280" text-anchor="middle">
    <text x="555" y="240">p1</text><text x="645" y="210">p2</text><text x="735" y="240">p3</text><text x="825" y="210">p4</text>
    <text x="555" y="340">p5</text><text x="645" y="310">p6</text><text x="735" y="340">p7</text><text x="825" y="310">p8</text>
  </g>

  <!-- Promote arrow: passive p1 -> active D's slot (illustrating promotion on active-peer failure) -->
  <path d="M 555 206 C 490 260, 440 300, 425 320" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#hv-promote)"/>
  <text x="470" y="270" font-family="system-ui" font-size="8.5" fill="#1d4ed8">promote/2</text>

  <!-- Evict arrow: overflowing active D -> passive p4 -->
  <path d="M 425 335 C 620 370, 780 300, 825 204" fill="none" stroke="#f97316" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#hv-evict)"/>
  <text x="600" y="368" font-family="system-ui" font-size="8.5" fill="#c2410c">demote_random_active/1 (over cap)</text>

  <!-- Shuffle -->
  <path d="M 425 161 C 470 175, 510 195, 553 214" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#hv-shuffle)"/>
  <text x="440" y="185" font-family="system-ui" font-size="8" fill="#7c3aed">SHUFFLE sample</text>

  <!-- Footer -->
  <text x="450" y="400" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#374151">Both views are pure data (macula_hyparview_view) — mutations return a new view, they never touch the network</text>
  <text x="450" y="416" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#374151">macula_hyparview_proto:process/4 drives JOIN / FORWARD_JOIN / NEIGHBOR / DISCONNECT / SHUFFLE against this structure</text>
  <text x="450" y="431" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#9ca3af">Plumtree's eager-push tree is built from exactly this active view — see plumtree_broadcast_tree.svg</text>
</svg>
