<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="700" height="270" fill="url(#bg3)"/>

  <text x="350" y="30" text-anchor="middle" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Identity and Crypto Stack (NIF-accelerated)</text>
  <text x="350" y="48" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Rust NIFs; ML-DSA from macula-mldsa (FIPS 204, NIST ACVP-verified)</text>

  <!-- NIF background glow -->
  <rect x="20" y="62" width="660" height="170" rx="12" fill="url(#rustGrad)" stroke="#a371f7" stroke-width="0.5" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="660" y="80" text-anchor="end" fill="#a371f7" font-family="monospace" font-size="9" opacity="0.6">native/ Rust NIFs</text>

  <!-- Node keys -->
  <rect x="60" y="90" width="260" height="126" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="190" y="112" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Node keys</text>
  <text x="190" y="130" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="10">macula_node_keys</text>
  <text x="72" y="152" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">ML-DSA-87; + RSA-PSS as LAMPS composite (EU)</text>
  <text x="72" y="167" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">generate/2 node_id/1 key_id/1</text>
  <text x="72" y="182" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">sign/2 verify/4</text>
  <text x="72" y="197" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">save/2 load/3 (seeds)</text>

  <!-- UCAN -->
  <rect x="380" y="90" width="260" height="126" rx="8" fill="#21262d" stroke="#f97316" stroke-width="1.2"/>
  <text x="510" y="112" text-anchor="middle" fill="#f97316" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">UCAN Tokens</text>
  <text x="510" y="130" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="10">macula_ucan_nif</text>
  <text x="392" y="152" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">create/4,5</text>
  <text x="392" y="167" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">verify/2 decode/1</text>
  <text x="392" y="182" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">get_capabilities/1</text>
  <text x="392" y="197" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">still Ed25519</text>

  <!-- Bottom note -->
  <text x="350" y="256" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10">A node_id is SHA-256 over its identity key. A realm's key endorses its members.</text>
</svg>
